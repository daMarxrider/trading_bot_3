# SPDX-License-Identifier: GPL-3.0-or-later
# Runs the test suite on every pull request and on pushes to main; release.yml reuses it.
# The `pytest` job (Linux) is a required status check for merging into main; `pytest-os` runs the same suite on
# Windows and macOS (#6). Tests marked slow run only on PRs
# labelled `slow tests` (adding the label reruns the job).
name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}  # workflow = the caller's when reused
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no moving major tags
        with:
          enable-cache: true

      - name: Qt runtime libraries (offscreen GUI tests)
        # The runner image fetches packages from its own mirror (azure.archive.ubuntu.com, via
        # /etc/apt/apt-mirrors.txt), which is sometimes unreachable. Retry, and from the second attempt on use
        # archive.ubuntu.com directly. Every apt call is capped with `timeout`: with the mirror down apt otherwise
        # hangs for many minutes.
        run: |
          opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if [ "$attempt" = 2 ]; then
              echo "using archive.ubuntu.com instead of the runner's mirror"
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            sudo timeout 90 apt-get update -q $opts || true
            sudo timeout 120 apt-get install -y -q $opts libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 && exit 0
            echo "apt attempt $attempt failed"
            sleep 10
          done
          exit 1

      # no `gpu` extra: torch is large and CI has no GPU; torch-only tests skip themselves
      - name: Install
        run: uv sync --extra gui --python 3.14

      - name: Test
        run: uv run pytest -q ${{ contains(github.event.pull_request.labels.*.name, 'slow tests') && '--slow' || '' }}
        env:
          QT_QPA_PLATFORM: offscreen

  pytest-os:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # one OS failing must not hide the other
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra gui --python 3.14

      - name: Test
        run: uv run pytest -q tests/test_brokers_data.py::test_plugin_loader tests/test_lab_symbols.py::test_side_panel_never_scrolls_sideways tests/test_lab_tooltips.py::test_long_press_by_touch_shows_the_tooltip
        env:
          QT_QPA_PLATFORM: offscreen
