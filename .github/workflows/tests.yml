# SPDX-License-Identifier: GPL-3.0-or-later
# Runs the test suite on every pull request and on pushes to main; release.yml reuses it.
# The `pytest` job is a required status check for merging into main. Tests marked slow run only on PRs
# labelled `slow tests` (adding the label reruns the job).
name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}  # workflow = the caller's when reused
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no moving major tags
        with:
          enable-cache: true

      - name: Qt runtime libraries (offscreen GUI tests)
        # The runner image fetches packages from its own mirror (azure.archive.ubuntu.com, via
        # /etc/apt/apt-mirrors.txt), which is sometimes unreachable. Retry, and from the third attempt on use
        # archive.ubuntu.com directly.
        run: |
          opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if [ "$attempt" = 3 ]; then
              echo "using archive.ubuntu.com instead of the runner's mirror"
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            sudo apt-get update -q $opts || true
            sudo apt-get install -y -q $opts libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 && exit 0
            echo "apt attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1

      # no `gpu` extra: torch is large and CI has no GPU; torch-only tests skip themselves
      - name: Install
        run: uv sync --extra gui --python 3.14

      - name: Test
        run: uv run pytest -q ${{ contains(github.event.pull_request.labels.*.name, 'slow tests') && '--slow' || '' }}
        env:
          QT_QPA_PLATFORM: offscreen
