# SPDX-License-Identifier: GPL-3.0-or-later
# Builds standalone binaries with PyInstaller (packaging/tradebot.spec) after the test suite passes.
# A v* tag publishes them to the GitHub Release for that tag; a manual run from a branch
# ("Run workflow") only uploads them as workflow artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # tag.yml dispatches this for its tags: tags pushed with GITHUB_TOKEN trigger no push event

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # oldest available runner: a binary built against an old glibc also runs on newer distros
            platform: linux-x86_64
            bin: dist/tradebot
            gui: ./tradebot gui
          - os: windows-latest
            platform: windows-x86_64
            bin: dist/tradebot
            gui: ./tradebot-gui.exe  # the windowed exe without a console
          - os: macos-15  # Apple Silicon
            platform: macos-arm64
            bin: dist/tradebot.app/Contents/MacOS
            gui: ./tradebot-gui  # what opening tradebot.app runs
          - os: macos-15-intel  # GitHub's last Intel image
            platform: macos-x86_64
            bin: dist/tradebot.app/Contents/MacOS
            gui: ./tradebot-gui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no moving major tags
        with:
          enable-cache: true

      - name: Qt runtime libraries (PyInstaller inspects them; also needed for the smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: uv sync --extra gui --group build --python 3.14

      - name: Build
        run: uv run pyinstaller --noconfirm packaging/tradebot.spec

      - name: Smoke test
        working-directory: ${{ matrix.bin }}
        env:
          QT_QPA_PLATFORM: offscreen
          TRADEBOT_PLUGIN_DIR: ${{ github.workspace }}/examples/plugins
        run: |
          ./tradebot --help
          ./tradebot list algorithms | grep donchian_breakout  # built-ins plus a directory plugin
          find "$GITHUB_WORKSPACE/dist" -path '*/plotext/_kernel/cpp/kernel.*' | grep .  # the terminal charts need plotext's C++ kernel
          find "$GITHUB_WORKSPACE/dist" -name THIRD_PARTY_NOTICES.txt | grep .  # licences of the bundled libraries (#58)
          find "$GITHUB_WORKSPACE/dist" -name LICENSE | grep -E '/(_internal|Resources)/LICENSE$'  # tradebot's own GPL text
          ! find "$GITHUB_WORKSPACE/dist" -iname 'pytr*' | grep .  # integrated third-party tools are never bundled
          ./tradebot --version | grep -q "not affiliated"
          if [[ "$RUNNER_OS" == macOS ]]; then  # opening the .app must start the GUI, not the CLI
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' ../Info.plist | grep -x tradebot-gui
            codesign --verify --deep --strict ../..  # the ad-hoc signature Apple Silicon requires
          fi
          ${{ matrix.gui }} & pid=$!
          sleep 20
          kill -0 $pid  # still running after 20 s = the GUI started fine
          kill $pid

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; else version=dev-${GITHUB_SHA::7}; fi
          if [[ "$RUNNER_OS" != macOS ]]; then  # also next to the binary, not only in _internal/ (the .app has them in Resources/)
            cp LICENSE build/tradebot/THIRD_PARTY_NOTICES.txt dist/tradebot/
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            asset=tradebot-$version-${{ matrix.platform }}.zip
            (cd dist && 7z a -tzip -bd "../$asset" tradebot >/dev/null)
          elif [[ "$RUNNER_OS" == macOS ]]; then
            asset=tradebot-$version-${{ matrix.platform }}.zip
            ditto -c -k --keepParent dist/tradebot.app "$asset"  # keeps the bundle's symlinks and ad-hoc signature
          else
            asset=tradebot-$version-${{ matrix.platform }}.tar.gz
            tar -czf "$asset" -C dist tradebot  # tar keeps the executable bit, which artifact zips would drop
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then sha="shasum -a 256"; else sha=sha256sum; fi  # each OS lacks the other
          $sha "$asset" > "$asset.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: tradebot-*-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    needs: build  # waits for every platform, so all assets land in one release without racing
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "Standalone builds, no Python needed; see the README's \"Download / run the binary\" section. The binaries are unsigned."
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
