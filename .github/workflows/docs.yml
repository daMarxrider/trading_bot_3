# SPDX-License-Identifier: GPL-3.0-or-later
# Keeps docs/ honest (#130): relative links and anchors resolve, docs/cli-reference.md matches the CLI,
# every command appears in docs/cli.md and docs/legal.md matches the in-app disclaimer.
# Fix a failure with `python scripts/check_docs.py --write` (regenerates the CLI reference) or by editing the page.
name: docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: "Install (core only: the CLI needs no extras)"
        run: uv sync --python 3.14

      - name: Check the documentation
        run: uv run python scripts/check_docs.py
