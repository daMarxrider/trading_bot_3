# SPDX-License-Identifier: GPL-3.0-or-later
# Tags every merge into main with the next patch version (v0.1.0, v0.1.1, ...).
# Bump minor/major by pushing a tag by hand (e.g. v0.2.0); later merges continue from it.
name: tag

on:
  push:
    branches: [main]

concurrency:
  group: tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create next patch tag
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD already tagged"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          git tag "$next"
          git push origin "$next"
          echo "Tagged $next"
