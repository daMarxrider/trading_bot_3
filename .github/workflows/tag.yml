# SPDX-License-Identifier: GPL-3.0-or-later
# Tags every merge into main with the next semantic version, chosen by the merged PR's labels:
#   release: major  -> breaking change   (v1.4.2 -> v2.0.0)
#   release: minor  -> new feature       (v1.4.2 -> v1.5.0)
#   no label        -> bugfix / cosmetic (v1.4.2 -> v1.4.3)
# A tag pushed by hand also works; later merges continue from it.
name: tag

on:
  push:
    branches: [main]

concurrency:
  group: tag
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # dispatch release.yml
  pull-requests: read  # labels of the merged PR

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create next version tag
        run: |
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "HEAD already tagged"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/pulls" \
              --jq '[.[].labels[].name] | join(",")' || true)
            case ",$labels," in
              *",release: major,"*) next="v$((major + 1)).0.0" ;;
              *",release: minor,"*) next="v$major.$((minor + 1)).0" ;;
              *) next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          git tag "$next"
          git push origin "$next"
          echo "Tagged $next"
          # a tag pushed with GITHUB_TOKEN starts no other workflow, so start the release build explicitly
          if [ -f .github/workflows/release.yml ]; then
            gh workflow run release.yml --ref "$next"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
